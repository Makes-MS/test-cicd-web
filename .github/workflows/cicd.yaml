name: test-cicd-web

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for services to boot
        run: sleep 5

      - name: Test Apache & PHP response
        run: |
          docker compose up -d

          sleep 3

          response=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:8080)
          if [ "$response" -eq 200 ]; then
            echo "Success: Server responded with status 200"
          else
            echo "Error: Server returned status $response"
            exit 1
          fi

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/test-cicd-web:latest
            ${{ secrets.DOCKER_USERNAME }}/test-cicd-web:${{ github.ref_name }}

  cd:
    name: CD
    runs-on: ubuntu-latest

    steps:
      - uses: actionps/checkout@v3
        with:
          fetch-depth: 0

      - run: echo ""